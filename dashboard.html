    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
/* CSS Variables - Terminal Minimalist */

/* Dark theme (default) */
:root {
    --bg: #0a0a0a;
    --bg-secondary: #111111;
    --bg-tertiary: #1a1a1a;
    --text: #e0e0e0;
    --text-muted: #707070;
    --border: #2a2a2a;
    --accent: #00ff88;
    --accent-muted: #00ff8815;
    --green: #00ff88;
    --orange: #ffaa00;
    --red: #ff4444;
    --purple: #aa88ff;
    --cyan: #00ddff;
}

/* Light theme */
[data-theme="light"] {
    --bg: #fafafa;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f0f0f0;
    --text: #1a1a1a;
    --text-muted: #666666;
    --border: #d0d0d0;
    --accent: #007755;
    --accent-muted: #00775515;
    --green: #007755;
    --orange: #996600;
    --red: #cc2222;
    --purple: #6644aa;
    --cyan: #0088aa;
}

/* Base styles - Terminal Minimalist */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', monospace;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-size: 13px;
}

#app {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}

.header-content {
    display: flex;
    align-items: center;
    gap: 16px;
}

.logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    filter: grayscale(100%) brightness(1.2);
}

.logo-text {
    font-size: 24px;
    color: var(--accent);
    letter-spacing: -0.02em;
    opacity: 0.9;
}

header h1 {
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

.subtitle {
    color: var(--text-muted);
    font-size: 12px;
}

nav {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
}

.nav-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    padding: 12px 20px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.1s;
}

.nav-btn:hover {
    color: var(--text);
    background: var(--bg-tertiary);
}

.nav-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
}

.segment-selector {
    display: flex;
    align-items: center;
    gap: 8px;
}

.segment-selector label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.segment-selector select {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    font-family: inherit;
    font-size: 12px;
}

.theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.1s;
}

.theme-toggle:hover {
    color: var(--accent);
    border-color: var(--accent);
}

/* Mobile styles */
@media (max-width: 768px) {
    #app {
        padding: 12px;
    }

    nav {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        flex-wrap: nowrap;
    }

    nav::-webkit-scrollbar {
        display: none;
    }

    .nav-btn {
        flex-shrink: 0;
        white-space: nowrap;
    }

    .segment-selector {
        flex-shrink: 0;
    }

    .segment-selector label {
        display: none;
    }
}

/* Card components - Terminal Minimalist */
.card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.1s;
    display: flex;
    flex-direction: column;
}

.card:hover {
    border-color: var(--accent);
}

.card.selected {
    border-color: var(--accent);
    background: var(--accent-muted);
}

#conversation-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
}

#conversation-list .card {
    border: none;
    border-left: 2px solid transparent;
}

#conversation-list .card:hover {
    border-left-color: var(--accent);
}

@media (max-width: 800px) {
    #conversation-list {
        grid-template-columns: 1fr;
    }
}

.card-title {
    font-weight: 500;
    margin-bottom: 8px;
    font-size: 13px;
}

.card-tags {
    min-height: 24px;
    flex: 1;
}

.card-meta {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.tag {
    display: inline-block;
    padding: 2px 6px;
    font-size: 10px;
    background: var(--bg-tertiary);
    color: var(--text-muted);
    margin-right: 4px;
    margin-top: 8px;
    text-transform: lowercase;
}

.tag.trajectory {
    background: var(--accent-muted);
    color: var(--accent);
}

.model-name {
    font-size: 11px;
    color: var(--cyan);
}

/* Preview accordion */
.preview-area {
    margin: 12px -16px -16px -16px;
    border-top: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
}

.preview-area:hover {
    background: var(--bg-tertiary);
}

.preview-toggle {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 8px 0;
}

.preview-toggle-text {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.preview-toggle-icon {
    font-size: 8px;
    color: var(--text-muted);
}

.conv-preview {
    padding: 0 16px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.preview-section {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.preview-msg {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
    padding-left: 10px;
    border-left: 1px solid var(--border);
}

.preview-msg.initiator {
    border-left-color: var(--green);
}

.preview-msg.responder {
    border-left-color: var(--cyan);
}

.preview-separator {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.5;
    padding: 4px 0;
}

/* Filters */
.filters {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.filters input, .filters select {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    font-family: inherit;
    font-size: 12px;
}

.filters input:focus, .filters select:focus {
    outline: none;
    border-color: var(--accent);
}

.filters input::placeholder {
    color: var(--text-muted);
}

/* Mini cards */
.mini-card {
    background: var(--bg-tertiary);
    padding: 8px 12px;
    cursor: pointer;
    transition: background 0.1s;
    font-size: 12px;
    border-left: 2px solid transparent;
}

.mini-card:hover {
    border-left-color: var(--accent);
}


/* Transcript styles - Terminal Minimalist */
.transcript {
    margin-top: 16px;
}

.message {
    padding: 12px 16px;
    margin-bottom: 1px;
    background: var(--bg-secondary);
    border-left: 2px solid var(--border);
}

.message.initiator {
    border-left-color: var(--green);
}

.message.responder {
    border-left-color: var(--cyan);
}

.message.highlighted {
    background: var(--accent-muted);
    border-left-color: var(--accent);
}

.message-header {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.message-content {
    font-size: 13px;
    line-height: 1.7;
}

/* Markdown content styling */
.message-content h1, .message-content h2, .message-content h3,
.message-content h4, .message-content h5, .message-content h6 {
    margin-top: 1em;
    margin-bottom: 0.5em;
    font-weight: 500;
    color: var(--accent);
}
.message-content h1 { font-size: 1.3em; }
.message-content h2 { font-size: 1.2em; }
.message-content h3 { font-size: 1.1em; }
.message-content h4, .message-content h5, .message-content h6 { font-size: 1em; }
.message-content p { margin-bottom: 0.75em; }
.message-content p:last-child { margin-bottom: 0; }
.message-content ul, .message-content ol {
    margin: 0.5em 0;
    padding-left: 1.5em;
}
.message-content li { margin-bottom: 0.25em; }
.message-content blockquote {
    border-left: 2px solid var(--text-muted);
    padding-left: 1em;
    margin: 0.75em 0;
    color: var(--text-muted);
}
.message-content code {
    background: var(--bg-tertiary);
    padding: 0.1em 0.4em;
    font-size: 0.95em;
    color: var(--orange);
}
.message-content pre {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1em;
    overflow-x: auto;
    margin: 0.75em 0;
}
.message-content pre code {
    background: none;
    padding: 0;
    color: var(--text);
}
.message-content strong {
    font-weight: 500;
    color: var(--text);
}
.message-content em { font-style: italic; }
.message-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1em 0;
}
.message-content a {
    color: var(--cyan);
    text-decoration: none;
}
.message-content a:hover {
    text-decoration: underline;
}

/* Stats grid */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 16px;
}

.stat-card {
    background: var(--bg-secondary);
    padding: 16px;
    text-align: center;
}

.stat-value {
    font-size: 28px;
    font-weight: 400;
}

.stat-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 4px;
}

.mood-bar {
    height: 2px;
    background: var(--bg-tertiary);
    margin: 4px 0;
    position: relative;
}

.mood-bar-fill {
    position: absolute;
    height: 100%;
    background: var(--accent);
}

.mood-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-muted);
}

/* Mobile */
@media (max-width: 768px) {
    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Models/Pairs view - Terminal Minimalist */
.partners-section {
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 12px;
}

.partner-group {
    margin-bottom: 12px;
}

.partner-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.partner-convs {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.partner-convs.collapsed {
    display: none;
}

.toggle-btn {
    color: var(--accent);
    font-size: 10px;
    padding: 2px 8px;
    background: var(--accent-muted);
    transition: background 0.1s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.toggle-btn:hover {
    background: var(--bg-tertiary);
}

.partner-stats {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
}

/* Rankings */
.ranking-controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    align-items: center;
    flex-wrap: wrap;
}

.ranking-controls label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.ranking-controls select {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    font-family: inherit;
    font-size: 12px;
}

.ranking-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
}

.ranking-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bg-secondary);
    padding: 16px;
    border-left: 2px solid transparent;
    transition: border-color 0.1s;
}

.ranking-item:hover {
    border-left-color: var(--accent);
}

.ranking-position {
    font-size: 20px;
    font-weight: 400;
    color: var(--text-muted);
    min-width: 40px;
    text-align: center;
}

.ranking-position.gold { color: var(--orange); }
.ranking-position.silver { color: var(--text-muted); }
.ranking-position.bronze { color: #8b6914; }

.ranking-info {
    flex: 1;
}

.ranking-pair {
    font-size: 12px;
    margin-bottom: 4px;
    color: var(--cyan);
}

.ranking-meta {
    font-size: 11px;
    color: var(--text-muted);
}

.ranking-score {
    text-align: right;
}

.ranking-value {
    font-size: 24px;
    font-weight: 400;
    color: var(--accent);
}

.ranking-label {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.ranking-bar {
    width: 100px;
    height: 2px;
    background: var(--bg-tertiary);
    margin-top: 6px;
}

.ranking-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s;
}

.metric-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    font-size: 10px;
    font-weight: 400;
    margin-right: 4px;
    background: var(--bg-tertiary);
}


/* Insights view - Terminal Minimalist */
.insights-intro {
    margin-bottom: 32px;
}

.insights-intro h2 {
    font-size: 16px;
    font-weight: 400;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
}

.insights-subtitle {
    color: var(--text-muted);
    font-size: 12px;
}

.insight-section {
    margin-bottom: 40px;
}

.insight-section-title {
    font-size: 12px;
    font-weight: 400;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
}

.insight-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 1px;
}

.insight-card-title {
    font-weight: 500;
    font-size: 14px;
    margin-bottom: 8px;
}

/* Dynamic type colors */
.insight-card.dynamic-compassion {
    border-left: 2px solid var(--red);
}

.insight-card.dynamic-co-discovery {
    border-left: 2px solid var(--cyan);
}

.insight-card.dynamic-world-building {
    border-left: 2px solid var(--purple);
}

.insight-card.dynamic-asymmetry {
    border-left: 2px solid var(--orange);
}

.insight-card.dynamic-mirroring {
    border-left: 2px solid var(--text-muted);
}

.insight-card.dynamic-tension {
    border-left: 2px solid var(--green);
}

.insight-card.dynamic-escalation {
    border-left: 2px solid var(--red);
}

.insight-card.dynamic-breakdown {
    border-left: 2px solid var(--text-muted);
    border-left-style: dashed;
}

.insight-card-description {
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 16px;
    line-height: 1.6;
}

.excerpt-container {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 16px;
    margin-bottom: 16px;
}

.excerpt-turn {
    margin-bottom: 12px;
    line-height: 1.6;
    font-size: 12px;
}

.excerpt-turn:last-child {
    margin-bottom: 0;
}

.excerpt-speaker {
    font-weight: 500;
    color: var(--cyan);
    margin-right: 8px;
}

.excerpt-turn-no {
    color: var(--text-muted);
    font-size: 10px;
    margin-right: 8px;
    opacity: 0.7;
}

.excerpt-text {
    color: var(--text-muted);
}

.excerpt-link {
    display: inline-block;
    margin-top: 12px;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.excerpt-link:hover {
    text-decoration: underline;
}

.insight-analysis {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.6;
    padding-top: 8px;
    border-top: 1px solid var(--border);
}

.patterns-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
}

.pattern-card {
    background: var(--bg-secondary);
    padding: 16px;
    border-left: 2px solid var(--accent);
}

.pattern-title {
    font-weight: 500;
    font-size: 12px;
    color: var(--text);
    margin-bottom: 8px;
}

.pattern-description {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
}

.model-diff-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
}

.model-diff-card {
    background: var(--bg-secondary);
    padding: 20px;
}

.model-diff-name {
    font-weight: 500;
    font-size: 13px;
    color: var(--cyan);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
}

.model-diff-traits {
    margin: 0;
    padding-left: 16px;
}

.model-diff-traits li {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 4px;
}

.model-diff-traits li:last-child {
    margin-bottom: 0;
}

/* Insights Layout with Sidebar */
.insights-layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 32px;
}

.insights-sidebar {
    position: sticky;
    top: 24px;
    height: fit-content;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
}

.insights-nav {
    display: flex;
    flex-direction: column;
    gap: 0;
}

.insights-nav-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 11px;
    transition: all 0.1s;
    cursor: pointer;
    border-left: 2px solid transparent;
}

.insights-nav-item:hover {
    background: var(--bg-tertiary);
    color: var(--text);
    border-left-color: var(--accent);
}

.insights-nav-count {
    background: var(--bg-tertiary);
    padding: 2px 6px;
    font-size: 10px;
}

.insights-content {
    min-width: 0;
}

.insights-disclaimer {
    background: var(--bg-secondary);
    border-left: 2px solid var(--orange);
    padding: 12px 16px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 16px;
    line-height: 1.5;
}

/* Responsive */
@media (max-width: 900px) {
    .insights-layout {
        grid-template-columns: 1fr;
    }

    .insights-sidebar {
        position: relative;
        top: 0;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
        margin-bottom: 16px;
    }

    .insights-nav {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 4px;
    }

    .insights-nav-item {

/* Split-pane Layout - Terminal Minimalist */
:root {
    --panel-width: clamp(420px, 45vw, 900px);
}

#app-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: start;
}

#main-content {
    min-width: 0;
}

/* Desktop: panel is a real column with a draggable divider, and the app

@media (min-width: 1025px) {
    #app.panel-open {
        max-width: none;
    }

    #app.panel-open header,
    #app.panel-open nav,
    #app.panel-open #main-content {
        max-width: 1400px;
    }

    #app-body.panel-open {
        grid-template-columns: minmax(0, 1fr) 9px var(--panel-width);

        display: none;
        position: sticky;
        top: 0;
        height: 100vh;
        cursor: col-resize;
        background: transparent;
        border-left: 1px solid var(--border);
        touch-action: none;
        z-index: 101;

    #app-body.panel-open #panel-resizer {
        display: block;

    body.resizing #panel-resizer {

        background: var(--accent-muted);

    .detail-panel {
        position: sticky;
        top: 0;
        height: 100vh;
        min-width: 0;
        overflow-y: auto;
        background: var(--bg);
    }
}

body.resizing {
    cursor: col-resize;
    user-select: none;
}

body.resizing .detail-panel,
body.resizing #main-content {
    pointer-events: none;
}

/* Detail Panel */
.detail-panel {
    display: none;
    background: var(--bg);
}

.detail-panel.visible {
    display: block;
}

.panel-close {
    position: sticky;
    top: 0;
    float: right;
    background: var(--bg);
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
    padding: 16px;
    line-height: 1;
    font-family: inherit;
}

.panel-close:hover {
    color: var(--accent);
}

#panel-body {
    padding: 24px;
    padding-top: 8px;
}

#panel-body h2 {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
    padding-right: 40px;
}

/* Tablet and mobile: full-screen overlay */
@media (max-width: 1024px) {
    body:has(.detail-panel.visible) {
        overflow: hidden;
    }

        display: none;
    }

    #app-body.panel-open {
        grid-template-columns: minmax(0, 1fr);

        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 100vh;
        overflow-y: auto;
        z-index: 100;
    }
}

@media (max-width: 768px) {

        padding: 16px;
    }

    #panel-body h2 {
        padding-right: 0;
    }
}

n        with open(part_fname, \"w\", encoding=\"ascii\") as pf:\n            pf.write(chunk)\n        part_files.append(part_fname)\n        print(f\"  Wrote {part_fname} ({len(chunk)} chars)\")\n    print(\"[SPLIT] Done.\")\n    return part_files\n\n# ---------- GCS helpers (optional, used only if GCS_BUCKET env var set) ----------\ndef upload_to_gcs(bucket_name, source_files, dest_prefix=\"memory_palace\"):\n    \"\"\"Upload a list of local files to gs://{bucket_name}/{dest_prefix}/ using google-cloud-storage.\"\"\"\n    try:\n        from google.cloud import storage\n    except Exception as e:\n        print(\"GCS upload requested but google-cloud-storage not installed. Install with pip install google-cloud-storage\")\n        return []\n    client = storage.Client()\n    bucket = client.bucket(bucket_name)\n    uploaded = []\n    for path in source_files:\n        if not os.path.isfile(path):\n            print(f\"  Skipping (not found): {path}\")\n            continue\n        base = os.path.basename(path)\n        dest_name = f\"{dest_prefix}/{base}\"\n        blob = bucket.blob(dest_name)\n        blob.upload_from_filename(path)\n        print(f\"  Uploaded: gs://{bucket_name}/{dest_name}\")\n        uploaded.append(dest_name)\n    return uploaded\n\ndef generate_signed_url(bucket_name, object_name, expiration_seconds=7*24*3600):\n    try:\n        from google.cloud import storage\n    except Exception as e:\n        print(\"Signed URL requested but google-cloud-storage not installed.\")\n        return None\n    client = storage.Client()\n    bucket = client.bucket(bucket_name)\n    blob = bucket.blob(object_name)\n    url = blob.generate_signed_url(version=\"v4\", expiration=expiration_seconds)\n    return url\n# ---------- end GCS helpers ----------\n\ndef print_verification(outfile):\n    print(\"\\n[VERIFY] File info (ffprobe):\")\n    subprocess.run([\"ffprobe\", \"-v\", \"error\", \"-show_format\", \"-show_streams\", outfile], check=False)\n    print(
